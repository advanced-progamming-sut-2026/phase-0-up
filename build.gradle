plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
}

group = 'ir.sharif.ap.pvz2'
version = '1.0-SNAPSHOT'

// Java 21 is the floor, not a preference: models/map/Row.java uses List.getFirst(), which is a
// SequencedCollection method added in 21. Compiling with --release 17 fails on exactly that call.
//
// This targets Java 21 with whatever JDK Gradle is already running on (21 or newer), rather than a
// `toolchain { languageVersion = 21 }`. A toolchain PINS the compiler to exactly 21 and, when 21 is
// not installed, makes Gradle download it from the internet -- which stalls forever behind a locked
// half-finished provisioning here, because international internet is unavailable in this environment.
// options.release = 21 (set on JavaCompile below) produces identical 21 bytecode using the installed
// JDK 25, so nothing has to be fetched.
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    // libPVZ and TenPatch are published through JitPack rather than Maven Central. Declared after
    // mavenCentral() on purpose: Gradle asks the repositories in order, and JitPack builds artifacts
    // on demand, so letting it answer for gson/gdx/junit first would be slow for no benefit.
    maven { url = 'https://jitpack.io' }
}

// Pinned to what is already in the local Gradle cache. International internet is unreliable in this
// environment (see gradle.properties), so bumping this is a deliberate, online-only decision -- not
// something to do casually while working offline.
ext {
    gdxVersion = '1.14.2'
}

dependencies {
    // Replaces the hand-managed libs/gson-2.14.0.jar -- same version, now resolved and cached by Gradle.
    implementation 'com.google.code.gson:gson:2.14.0'

    // --- Phase 2 GUI ---------------------------------------------------------------------------
    // LibGDX proper. gdx-platform/gdx-freetype-platform carry the native .dll/.so/.dylib payloads and
    // are runtimeOnly: nothing compiles against them, but the game cannot open a window without them.
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    runtimeOnly "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"

    // A Scene2D skin styled like PvZ2, plus the FreeTypeSkin loader it needs. Pulled as a jar rather
    // than copied into the repo: the skin ships its atlas, 3 MB page PNG and six TTFs as CLASSPATH
    // resources, and Gdx.files.internal() falls back to the classpath, so "skin/pvz2_skin.json"
    // resolves out of the jar with nothing to check in or keep in sync.
    implementation 'com.github.pizpizi:pvz-skin:v0.1.0'

    // Required by that skin, whose backgrounds are TenPatch drawables rather than plain nine-patches.
    // The skin's JSON names these classes directly, so it fails to load without it.
    implementation 'com.github.raeleus.TenPatch:tenpatch:5.2.3'

    // Renders PopCap .PAM skeletal animations. pvz-assets/ ships body PARTS in its atlases, never whole
    // character frames, so there is no way to draw a plant or zombie without a PAM runtime. Always used
    // through views.gdx.sprite.EntitySprite, never called directly from a renderer -- see
    // documents/phase-2-roadmap.md, Part 3.
    implementation 'com.github.pizpizi:libPVZ:v0.1.5'

    // LibGDX 1.14.2 pulls LWJGL 3.3.3, which predates the JNI version JDK 22+ reports. On the JDK 25
    // installed here that prints "[LWJGL] Unsupported JNI version detected, this may result in a crash"
    // on every launch. 3.3.6 is the same patch series (no API change for the lwjgl3 backend) and knows
    // about the newer JNI. Drop this constraint once LibGDX itself ships a 3.3.4+ default.
    implementation platform('org.lwjgl:lwjgl-bom:3.3.6')

    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Enforces the MVC boundary mechanically instead of by discipline: ArchitectureTest fails the build
    // if anything under models/ ever imports com.badlogic.gdx or views. That rule is the whole reason
    // Phase 2 can swap the View without touching the 57 Commands.
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
}

// This project keeps its sources in src/ (packages sit directly under it) rather than the Gradle
// default src/main/java, so the layout is declared explicitly instead of moving 388 files and handing
// every teammate a merge conflict. Tests live in test/ for the same reason -- putting them under
// src/test/java would nest them inside the main source set and compile them into the game.
sourceSets {
    main {
        java {
            srcDirs = ['src']
            // The graphify knowledge-graph cache lives at src/graphify-out (~6 MB of JSON, git-ignored).
            // It holds no sources, but excluding it keeps it out of Gradle's input snapshotting so it
            // cannot slow the build or churn up-to-date checks.
            exclude 'graphify-out/**'
        }
        resources { srcDirs = [] }      // data/ is read from disk at runtime, not from the classpath
    }
    test {
        java { srcDirs = ['test'] }
        resources { srcDirs = [] }
    }
}

application {
    // Main lives in the default package, at src/Main.java.
    mainClass = 'Main'
}

// The sources contain Persian comments and the game prints Persian/box-drawing text, so every step
// that touches bytes is pinned to UTF-8. Without this the build inherits the platform encoding
// (windows-1252 here) and both the comments and the output are mangled.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Emit Java 21 bytecode using the running JDK, so no separate JDK 21 has to be installed/fetched.
    options.release = 21
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('run') {
    // The game is an interactive REPL. Gradle does NOT wire stdin to the application by default, so
    // without this the game reads EOF immediately and exits before you can type a single command.
    standardInput = System.in

    // data/*.json and users_database.json are opened with RELATIVE paths, so the process has to start
    // in the project root. Gradle already defaults to this, but it is pinned because the whole game
    // fails to load its levels if it ever changes.
    workingDir = rootDir

    jvmArgs '-Dfile.encoding=UTF-8'
}

// `gradlew runGui` starts the LibGDX build; `gradlew run` still starts the terminal build. Both drive
// the SAME models, systems and Commands -- only the renderer implementations differ -- so the terminal
// game doubles as the regression harness for every change made on the GUI side.
//
// No standardInput here, unlike `run`: nothing in the GUI path may read stdin. Two commands still call
// views.InputHandler.readLine() mid-execute (RegisterCommand, ForgetPasswordCommand) and would freeze
// the render thread if they were ever reached from a Screen.
tasks.register('runGui', JavaExec) {
    group = 'application'
    description = 'Runs the LibGDX graphical build (Phase 2).'
    mainClass = 'DesktopLauncher'
    classpath = sourceSets.main.runtimeClasspath

    // Same reason as `run`: data/*.json, users_database.json AND pvz-assets/ are all opened with
    // relative paths, so the process has to start in the project root.
    workingDir = rootDir

    // --enable-native-access silences the four-line warning JDK 24+ prints when LWJGL loads its
    // natives through System.load. It is a grant, not a workaround: LWJGL genuinely needs native
    // access, and without the flag the JDK will start refusing it in a future release.
    // --sun-misc-unsafe-memory-access=allow silences a second JDK 24+ warning: LWJGL's MemoryUtil
    // still calls the deprecated sun.misc.Unsafe. Nothing we can fix from here, and four warning lines
    // on every launch train people to ignore the console.
    jvmArgs '-Dfile.encoding=UTF-8', '--enable-native-access=ALL-UNNAMED',
            '--sun-misc-unsafe-memory-access=allow'

    // Forward any -Dpvz.* flag from the Gradle command line into the forked GUI JVM. Gradle sets -D on
    // ITS OWN process, not on the application it launches, so without this the SmokeHarness flags are
    // silently swallowed and the window just runs forever:
    //
    //   gradlew runGui -Dpvz.smokeFrames=90 -Dpvz.screenshot=build/shot.png
    //
    // That pair is how a rendering change gets verified without a human watching the window.
    System.properties.each { key, value ->
        if (key.toString().startsWith('pvz.')) {
            systemProperty(key.toString(), value)
        }
    }
}

// `gradlew browse` opens pizpizi's pvz-asset-browser against THIS project's asset folder.
//
// The browser is a separate desktop app (github.com/pizpizi/pvz-asset-browser) that reads the same
// dump the game does -- it happens to take the same -Dpvz.assets property, because both come from the
// same author. It is what to reach for when an animation does not look right and the question is "what
// is actually in the file": it plays PAM clips, lists parts and armor states, and lets a visibility map
// be tried out before any of it is written into a renderer.
//
// Deliberately NOT a dependency. It is a developer tool, it is not needed to build or play the game,
// and adding a 40 MB jar to the build for it would slow every clone down for something most sessions
// never open.
//
// Put the downloaded jar in tools/ (git-ignored), or point at it:
//   gradlew browse -PbrowserJar=D:/downloads/browser.jar
tasks.register('browse', Exec) {
    group = 'application'
    description = 'Opens the pvz-asset-browser on this project\'s pvz-assets folder.'

    def assetsPath = System.getProperty('pvz.assets') ?: file('pvz-assets').absolutePath
    def jarPath = project.findProperty('browserJar')
    def jar = jarPath ? file(jarPath) : fileTree(dir: 'tools', include: '*.jar').files.find { true }

    doFirst {
        if (jar == null || !jar.exists()) {
            throw new GradleException(
                    "No asset-browser jar found.\n" +
                    "  Download it from https://github.com/pizpizi/pvz-asset-browser/releases\n" +
                    "  then either drop it in ${file('tools')}\n" +
                    "  or run: gradlew browse -PbrowserJar=<path to the jar>")
        }
        if (!file(assetsPath).exists()) {
            throw new GradleException("pvz-assets not found at ${assetsPath} -- see README.md")
        }
    }

    // java -jar, not JavaExec: the browser ships as an executable jar and its Main-Class lives in the
    // manifest, which JavaExec has no way to honour without hard-coding the class name here.
    commandLine 'java', "-Dpvz.assets=${assetsPath}", '-jar',
            jar != null ? jar.absolutePath : 'missing.jar'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    workingDir = rootDir             // tests load the same relative data files the game does
    jvmArgs '-Dfile.encoding=UTF-8'
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

// The grading sheet scores Checkstyle findings, so the existing checkstyle.xml is wired in and can be
// run with `gradlew checkstyleMain`. It reports rather than fails the build: a style warning should
// not stop you from running the game while you are mid-change.
checkstyle {
    toolVersion = '10.17.0'          // supports the Checkstyle 1.3 DTD that checkstyle.xml declares
    configFile = file('checkstyle.xml')
    ignoreFailures = true
    maxWarnings = Integer.MAX_VALUE
}

// Bundles the game plus Gson into one runnable jar: `gradlew fatJar`, then
// `java -jar build/libs/PvZ2-AP-Project-1.0-SNAPSHOT-all.jar` FROM THE PROJECT ROOT (the relative
// data paths still apply -- the jar cannot carry data/ or the save file, which is written at runtime).
tasks.register('fatJar', Jar) {
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

// Prints the runtime classpath, so a plain `java -cp ...` launch (what an IntelliJ Application run
// configuration does) can be reproduced from the command line for troubleshooting.
tasks.register('printRuntimeCp') {
    doLast { println sourceSets.main.runtimeClasspath.asPath }
}
