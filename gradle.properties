# International internet is unavailable in this environment, so Gradle must never try to reach out for
# a JDK. Auto-download of Java toolchains is turned off: the build targets Java 21 bytecode using the
# installed JDK (see build.gradle's options.release = 21), so no separate JDK download is needed. This
# is what was hanging the build -- a Java 21 toolchain request stalled forever on a half-finished JDK
# download under ~/.gradle/jdks, which greyed out IntelliJ's Run button with nothing happening.
org.gradle.java.installations.auto-download=false
